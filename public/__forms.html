<!--
  Static form definitions for Netlify form detection (fightclub pattern).
  This file is served at /__forms.html and lets Netlify's crawler detect forms
  even though the real forms live inside Next.js React components.
-->
<form name="quote" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="quote" />
  <input name="bot-field" />
  <input name="name" />
  <input name="email" />
  <input name="phone" />
  <input name="vehicleYear" />
  <input name="vehicleMake" />
  <input name="vehicleModel" />
  <input name="agreedValue" />
  <input name="riderAge" />
  <input name="useType" />
  <input name="competitionUse" />
  <input name="state" />
  <input name="licenseNumber" />
  <input name="licenseIssueDate" />
  <input name="licenseExpirationDate" />
  <input name="dateOfBirth" />
  <input name="company" />
  <input name="operationType" />
  <input name="annualRevenue" />
  <input name="crewSize" />
  <input name="coverageNeeded" />
  <textarea name="message"></textarea>
  <input name="streetAddress" type="text" />
  <input name="vehicleVin" type="text" />
  <input name="vehicleValue" type="text" />
  <input name="accessoriesValue" type="text" />
  <input name="currentCarrierName" type="text" />
  <input name="currentPolicyNumber" type="text" />
  <input name="currentPolicyStartDate" type="date" />
  <input name="currentPolicyExpirationDate" type="date" />
  <input name="currentCoverageLimits" type="text" />
  <input name="priorAutoInsurance" type="text" />
  <textarea name="driverNames"></textarea>
  <textarea name="accessoriesDescription"></textarea>
  <input name="coverageType" />
  <input name="driversLicenseUpload" type="file" />
  <input name="insuranceCardUpload" type="file" />
</form>

<form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="contact" />
  <input name="bot-field" />
  <input name="name" />
  <input name="email" />
  <input name="phone" />
  <textarea name="message"></textarea>
</form>
